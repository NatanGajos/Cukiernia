<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Produkt | Okruszyna</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="product">
    <div id="app"></div>
    <div id="toast"></div>
    <template id="product-page-template">
      <div class="wrap">
        <div class="crumb">
          <a href="index.html">Strona główna</a> /
          <span data-product-category></span> / <span data-product-name></span>
        </div>
        <div class="pd">
          <div>
            <div class="ph big" data-product-image>
              <span class="pill product-tag" data-product-tag></span>
            </div>
            <div class="th">
              <span class="ph" data-product-thumbnail-one></span
              ><span class="ph" data-product-thumbnail-two></span
              ><span
                >Każdy wypiek dekorujemy ręcznie. Twój może nieznacznie różnić
                się od zdjęcia.</span
              >
            </div>
          </div>
          <div>
            <div class="eb">
              Kolekcja Okruszyny · <span data-product-category></span>
            </div>
            <h1 data-product-name></h1>
            <div class="st product-rating">
              ★★★★★ <span>4,9 / 5 · 12 przykładowych ocen</span>
            </div>
            <div class="serif product-price" data-product-price></div>
            <p class="product-description" data-product-description></p>
            <label class="l">Rozmiar i liczba porcji</label>
            <div class="opt">
              <span>◉ <span data-product-size></span></span
              ><span data-product-price></span>
            </div>
            <div>Kolor: <span data-product-color></span></div>
            <label class="l" for="ins"
              >Twój napis na torcie · opcjonalnie, gratis</label
            >
            <input class="in w" id="ins" maxlength="30" value="Sto lat!" />
            <small class="muted"
              ><span id="cn">8</span> / 30 znaków · Krótkie słowa, dużo
              radości.</small
            >
            <div class="product-actions">
              <div class="qty">
                <button data-a="dq" aria-label="Mniej">−</button
                ><span id="pq">1</span
                ><button data-a="uq" aria-label="Więcej">+</button>
              </div>
              <button class="btn" data-a="addp">
                <span>Dodaj do koszyka · </span
                ><span id="pt" data-product-price></span>
              </button>
            </div>
            <button class="u" data-a="fav" data-product-id>
              ♡ Zapisz na później
            </button>
            <small class="muted">· Odbiór od 6 listopada</small>
          </div>
        </div>
        <div class="two product-information">
          <div>
            <h2>To, co w środku, ma znaczenie.</h2>
            <p class="muted">Skład: <span data-product-ingredients></span></p>
            <div class="card product-allergens">
              <b>Alergeny: <span data-product-allergens></span></b>
              <p>
                W pracowni używamy też orzechów, soi i sezamu. Produkt może
                zawierać ich śladowe ilości.
              </p>
            </div>
          </div>
          <div>
            <div class="row">
              <h2>Słodkie słowa</h2>
              <button class="btn o" data-a="rv">Dodaj opinię</button>
            </div>
            <small class="muted"
              >Oceny i opinie są przykładową treścią projektu.</small
            >
          </div>
        </div>
      </div>
    </template>
    <script src="js/data.js?v=20261104"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/account.js"></script>
    <script src="js/admin.js?v=20261104-2"></script>
    <script src="js/checkout.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
